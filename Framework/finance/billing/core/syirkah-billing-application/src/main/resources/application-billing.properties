# Billing Platform Configuration
syirkah.billing.platform.enabled=true
syirkah.billing.platform.plugin-directory=billing/plugins

# Plugin Configuration
syirkah.billing.plugins.saas.enabled=true
syirkah.billing.plugins.digital.enabled=true
syirkah.billing.plugins.ecommerce.enabled=true
syirkah.billing.plugins.platform.enabled=true
syirkah.billing.plugins.services.enabled=true
syirkah.billing.plugins.custom.enabled=false

# Default Plugins by Product Type
syirkah.billing.default-plugin.SAAS_SUBSCRIPTION=saas-plugin-v1
syirkah.billing.default-plugin.DIGITAL_DOWNLOAD=digital-plugin-v1
syirkah.billing.default-plugin.PHYSICAL_GOODS=ecommerce-plugin-v1
syirkah.billing.default-plugin.PLATFORM_FEE=platform-plugin-v1

# Billing Cycles
syirkah.billing.cycles=MONTHLY,QUARTERLY,SEMI_ANNUAL,ANNUAL,BIENNIAL
syirkah.billing.default-cycle=MONTHLY

# Payment Gateway Selection
syirkah.billing.default-gateway=stripe
syirkah.billing.gateway.fallback=adyen

# Tax Configuration
syirkah.billing.tax.default=PPN
syirkah.billing.tax.rate=0.11
syirkah.billing.tax.rate-2025=0.12

# Notifications
syirkah.billing.notifications.enabled=true
syirkah.billing.notifications.channels=EMAIL,SMS,PUSH,WEBHOOK