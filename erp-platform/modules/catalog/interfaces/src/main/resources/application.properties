# Quarkus Configuration for Catalog Module
quarkus.http.port=8080

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/catalog_db
quarkus.datasource.username=catalog_user
quarkus.datasource.password=catalog_password
quarkus.datasource.reactive.max-size=20

# Hibernate Reactive
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql

# Kafka Configuration
mp.messaging.outgoing.product-events.connector=smallrye-kafka
mp.messaging.outgoing.product-events.topic=product-events
mp.messaging.outgoing.product-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Redis Configuration (for caching)
quarkus.redis.hosts=redis://localhost:6379

# OpenAPI
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."tech.kayys.erp".level=DEBUG